name: Build shared icon editor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source-rust
    steps:
      - uses: actions/checkout@v6
      - name: Compile shared WASM editor
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build -p icon-studio-web --release --target wasm32-unknown-unknown --locked
      - name: Generate browser bindings
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock","rb"))["package"] if p["name"]=="wasm-bindgen"))')
          curl --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          /tmp/wasm-bindgen-${version}-x86_64-unknown-linux-musl/wasm-bindgen --target web --out-dir dist/pkg target/wasm32-unknown-unknown/release/icon_studio_web.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: shared-editor-wasm
          path: source-rust/dist/pkg
          retention-days: 7
